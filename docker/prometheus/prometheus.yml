global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"

  # Uncomment when dcgm-exporter service is enabled (see docker-compose.yml)
  # - job_name: "dcgm"
  #   static_configs:
  #     - targets: ["dcgm-exporter:9400"]
