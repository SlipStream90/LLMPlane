receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: "0.0.0.0:8888"
    resource_to_telemetry_conversion:
      enabled: true

  logging:
    loglevel: warn

  # Send traces to Langfuse Cloud via OTLP/HTTP
  otlphttp/langfuse:
    endpoint: "https://cloud.langfuse.com/api/otel"
    headers:
      Authorization: "Basic ${LANGFUSE_AUTH_HEADER}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse, logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]
