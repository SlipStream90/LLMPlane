# ──────────────────────────────────────────────────────────────
# LiteLLM Gateway Configuration
# ──────────────────────────────────────────────────────────────
# WARNING: This file is rendered by the RoutingConfigService.
# Manual edits will be overwritten on next config reload.
# Use the /api/v1/routing-config endpoint to update.
# ──────────────────────────────────────────────────────────────

model_list:
  # Models will be dynamically populated by the backend's RoutingConfigService.
  # The backend pushes config updates via /config/reload.
  #
  # Example static entry (for reference only):
  # - model_name: "gpt-4o"
  #   litellm_params:
  #     model: "azure/gpt-4o"
  #     api_key: "os.environ/AZURE_API_KEY"
  #     api_base: "https://your-resource.openai.azure.com/"
  #   model_info:
  #     id: "gpt-4o-primary"
  #     max_input_tokens: 128000
  #     max_output_tokens: 16384

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  completion_model: "gpt-4o-mini"
  disable_spend_logs: false
  disable_error_logs: false

litellm_settings:
  # Drop any unsupported params without error
  drop_params: true
  # Set request timeout
  request_timeout: 600
  # Enable streaming
  stream: true
  # Cache configuration
  cache: true
  cache_params:
    type: "redis"
    url: "os.environ/REDIS_URL"
    ttl: 600

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  retry_after: 5
  timeout: 600
