version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: llmplane
      POSTGRES_USER: llmplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmplane_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmplane"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  gateway:
    image: ghcr.io/berriai/litellm:1.63.14
    restart: unless-stopped
    volumes:
      - ./gateway/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - frontend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://llmplane:${POSTGRES_PASSWORD:-llmplane_dev}@postgres:5432/llmplane
      - REDIS_URL=redis://redis:6379/0
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - BOOTSTRAP_ADMIN_TOKEN=${BOOTSTRAP_ADMIN_TOKEN}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ENABLE_STREAM_CONSUMER=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - frontend
    volumes:
      - docker_socket:/var/run/docker.sock

  workers:
    build:
      context: ../workers
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://llmplane:${POSTGRES_PASSWORD:-llmplane_dev}@postgres:5432/llmplane
      - REDIS_URL=redis://redis:6379/0
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - docker_socket:/var/run/docker.sock
      - benchmark_uploads:/app/benchmark_uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  scheduler:
    build:
      context: ../workers
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://llmplane:${POSTGRES_PASSWORD:-llmplane_dev}@postgres:5432/llmplane
      - REDIS_URL=redis://redis:6379/0
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
      - NEXT_PUBLIC_GATEWAY_URL=http://gateway:4000
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend

  langfuse:
    image: langfuse/langfuse:3
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://llmplane:${POSTGRES_PASSWORD:-llmplane_dev}@postgres:5432/llmplane
      - REDIS_URL=redis://redis:6379/0
      - NEXTAUTH_URL=http://localhost:3010
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
    ports:
      - "3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - frontend

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - internal
      - frontend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    networks:
      - internal

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  docker_socket:
  benchmark_uploads:

networks:
  internal:
    driver: bridge
  frontend:
    driver: bridge
