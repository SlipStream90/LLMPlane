name: Deploy

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/llmplane

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_GATEWAY_URL=${{ vars.NEXT_PUBLIC_GATEWAY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push workers
        uses: docker/build-push-action@v5
        with:
          context: ./workers
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/workers:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/workers:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            VERSION="${{ github.ref_name }}"
            REGISTRY="${{ env.REGISTRY }}"
            PREFIX="${{ env.IMAGE_PREFIX }}"
            DEPLOY_PATH="${{ vars.DEPLOY_PATH || '/opt/llmplane' }}"

            echo "=== LLMPlane Deploy $VERSION ==="
            cd "$DEPLOY_PATH"

            # Create temporary override file
            cat > docker-compose.deploy.yml <<EOF
            services:
              backend:
                image: ${REGISTRY}/${PREFIX}/backend:${VERSION}
              frontend:
                image: ${REGISTRY}/${PREFIX}/frontend:${VERSION}
              workers:
                image: ${REGISTRY}/${PREFIX}/workers:${VERSION}
            EOF

            # Pull and restart
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --remove-orphans

            # Wait for health
            sleep 15

            # Verify
            docker compose ps

            # Cleanup
            rm -f docker-compose.deploy.yml
            docker image prune -f --filter "until=168h"

            echo "=== Deploy complete ==="
