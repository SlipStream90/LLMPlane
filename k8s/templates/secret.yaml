apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "llmplane.labels" . | nindent 4 }}
type: Opaque
data: {}
# All values are injected via:
#   kubectl create secret generic llmplane-secrets \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=REDIS_URL='...' \
#     --from-literal=FERNET_SECRET_KEY='...' \
#     --from-literal=BOOTSTRAP_ADMIN_TOKEN='...' \
#     --from-literal=OPENROUTER_API_KEY='...' \
#     ...
