apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmplane.fullname" . }}-frontend
  labels:
    {{- include "llmplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "llmplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "llmplane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "llmplane.image" (dict "global" .Values.global "name" "frontend" "tag" .Values.frontend.image.tag) }}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://{{ .Values.ingress.hosts | first | dig "host" "localhost" }}/ws"
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: "/gateway"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llmplane.fullname" . }}-frontend
  labels:
    {{- include "llmplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "llmplane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
